<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <!-- Gradient Background -->
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#CCFBF1" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#0D9488" stop-opacity="0.05"/>
        </linearGradient>
        <radialGradient id="circle1" cx="20%" cy="30%" r="40%">
            <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="circle2" cx="80%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#0D9488" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Base -->
    <rect width="800" height="600" fill="url(#grad)"/>

    <!-- Dekorasi Lingkaran -->
    <circle cx="150" cy="150" r="200" fill="url(#circle1)"/>
    <circle cx="650" cy="450" r="250" fill="url(#circle2)"/>

    <!-- Pola titik-titik -->
    <g fill="#14B8A6" opacity="0.08">
        <circle cx="100" cy="100" r="4"/>
        <circle cx="250" cy="80" r="3"/>
        <circle cx="400" cy="120" r="5"/>
        <circle cx="550" cy="90" r="3"/>
        <circle cx="700" cy="110" r="4"/>
        <circle cx="120" cy="300" r="3"/>
        <circle cx="350" cy="350" r="4"/>
        <circle cx="600" cy="280" r="3"/>
        <circle cx="750" cy="320" r="4"/>
        <circle cx="200" cy="500" r="3"/>
        <circle cx="450" cy="480" r="4"/>
        <circle cx="680" cy="520" r="3"/>
    </g>

    <!-- Ilustrasi abstrak - bentuk geometris -->
    <g opacity="0.06">
        <rect x="100" y="400" width="60" height="60" rx="8" fill="#14B8A6" transform="rotate(15 130 430)"/>
        <rect x="650" y="100" width="50" height="50" rx="8" fill="#0D9488" transform="rotate(-10 675 125)"/>
        <circle cx="700" cy="200" r="30" fill="none" stroke="#14B8A6" stroke-width="4"/>
        <polygon points="150,200 180,150 210,200" fill="#14B8A6"/>
    </g>
</svg>